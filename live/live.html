<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz Rush Live</title>
<!--
  Quiz Rush Live — page pour OBS (source Navigateur, 1920x1080, "Contrôler l'audio via OBS").
  Paramètres d'URL (ou objet window.QR_CONFIG dans config.js à côté de ce fichier) :
    key=     clé API YouTube Data (lecture du chat)
    video=   ID de la vidéo du live (sinon recherche du live en cours de la chaîne)
    channel= ID de la chaîne (défaut : Quiz Rush Show)
    min=     durée du show en minutes (défaut 15)
    lat=     retard du flux en secondes pour compter les réponses (défaut 6)
    demo=1   joueurs simulés pour vérifier l'affichage (jamais en vrai live)
-->
<script src="config.js" onerror="window.QR_CONFIG=window.QR_CONFIG||{}"></script>
<style>
@font-face{font-family:Mont;src:url(https://raw.githubusercontent.com/meralae0/quizrush-assets/main/fonts/Montserrat%5Bwght%5D.ttf);font-weight:100 900}
@font-face{font-family:Pop;src:url(https://raw.githubusercontent.com/meralae0/quizrush-assets/main/fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Pop;src:url(https://raw.githubusercontent.com/meralae0/quizrush-assets/main/fonts/Poppins-Medium.ttf);font-weight:500}
:root{--bg:#0B1026;--y:#FFD23F;--p:#FF3D7F;--g:#2BD96B;--b:#5A8CFF;--card:#151c3d;--line:#26305e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:#fff;font-family:Pop,sans-serif}
body{background:radial-gradient(circle at 20% 10%,#1d2660 0,transparent 45%),radial-gradient(circle at 90% 90%,#3a1450 0,transparent 40%),var(--bg)}
#top{position:absolute;left:60px;right:60px;top:28px;height:70px;display:flex;align-items:center;gap:24px}
#logo{font-family:Mont;font-weight:900;font-size:44px;letter-spacing:1px}
#logo span{color:var(--y)}
#live{background:var(--p);font-family:Mont;font-weight:900;font-size:24px;padding:6px 16px;border-radius:10px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.65}}
#lvl{font-family:Mont;font-weight:900;font-size:24px;padding:6px 16px;border-radius:10px;background:var(--b)}
#count{margin-left:auto;font-size:26px;color:#c9d0ff}
#q{position:absolute;left:60px;width:1100px;top:118px;height:96px;display:flex;align-items:center;font-family:Mont;font-weight:800;font-size:42px;line-height:1.12}
#photo{position:absolute;left:60px;top:228px;width:1100px;height:660px;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 18px 50px #0008}
#photo img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#photo.contain img{object-fit:contain;background:#0d1330}
#opts{position:absolute;left:1210px;right:60px;top:228px;display:flex;flex-direction:column;gap:16px}
.o{height:98px;border-radius:20px;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 22px;font-size:34px;font-weight:700;transition:all .35s}
.o b{width:60px;height:60px;border-radius:14px;background:var(--b);display:flex;align-items:center;justify-content:center;font-family:Mont;font-weight:900;font-size:34px;flex:none}
.o.ok{background:#11402a;border-color:var(--g)}.o.ok b{background:var(--g);color:#05210f}
.o.no{opacity:.35}
.o .pct{margin-left:auto;font-size:26px;color:#c9d0ff;font-weight:500}
#board{position:absolute;left:1210px;right:60px;top:690px;height:300px;border-radius:22px;background:#10163a;border:3px solid var(--line);padding:16px 22px}
#board h3{font-family:Mont;font-weight:900;font-size:26px;color:var(--y);margin-bottom:8px;display:flex}
#board h3 small{margin-left:auto;font-family:Pop;font-weight:500;font-size:20px;color:#c9d0ff}
.r{display:flex;align-items:center;font-size:26px;height:40px}
.r i{font-style:normal;width:42px;font-family:Mont;font-weight:900;color:var(--y)}
.r span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r em{font-style:normal;font-family:Mont;font-weight:900;color:var(--g)}
#last{font-size:21px;color:#c9d0ff;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:absolute;left:60px;width:1100px;top:906px;height:22px;border-radius:12px;background:#1b2350;overflow:hidden}
#fill{height:100%;width:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--p));transform-origin:left}
#hint{position:absolute;left:60px;width:1100px;top:944px;display:flex;align-items:center;gap:18px;font-size:30px}
#hint .k{font-family:Mont;font-weight:900;background:var(--y);color:#111;padding:4px 14px;border-radius:10px}
#secs{margin-left:auto;font-family:Mont;font-weight:900;font-size:44px;color:var(--y)}
#fact{position:absolute;left:60px;width:1100px;top:780px;min-height:100px;padding:18px 24px;border-radius:0 0 26px 26px;background:linear-gradient(0deg,#000c,#0000);font-size:30px;font-weight:500;opacity:0;transition:opacity .4s}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--bg);z-index:5;text-align:center}
#cover h1{font-family:Mont;font-weight:900;font-size:120px}#cover h1 span{color:var(--y)}
#cover p{font-size:40px;color:#c9d0ff}
#cover .big{font-family:Mont;font-weight:900;font-size:64px;color:var(--y)}
#pod{display:flex;gap:40px;align-items:flex-end}
.pd{width:360px;border-radius:24px;background:var(--card);border:3px solid var(--line);padding:24px}
.pd .n{font-size:36px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pd .s{font-family:Mont;font-weight:900;font-size:56px;color:var(--g)}
#status{position:absolute;right:8px;bottom:4px;font-size:14px;color:#ffffff40}
</style>
</head>
<body>
<div id="top"><div id="logo">QUIZ <span>RUSH</span></div><div id="live">● LIVE</div><div id="lvl">EASY</div><div id="count"></div></div>
<div id="q"></div>
<div id="photo"><img id="img" alt=""></div>
<div id="fact"></div>
<div id="opts"></div>
<div id="board"><h3>LEADERBOARD · POINTS<small id="players"></small></h3><div id="rows"></div><div id="last"></div></div>
<div id="bar"><div id="fill"></div></div>
<div id="hint">Type <span class="k">A</span><span class="k">B</span><span class="k">C</span><span class="k">D</span> in the chat to score! <div id="secs"></div></div>
<div id="cover"></div>
<div id="status"></div>
<script>
const P=new URLSearchParams(location.search),C=Object.assign({},window.QR_CONFIG||{});
for(const [k,v] of P)C[k]=v;
const BASE=C.base||'https://raw.githubusercontent.com/meralae0/quizrush-assets/main/';
const KEY=C.key||'',CHANNEL=C.channel||'UCP6-GDdtcST5FCQnVwRN_LQ',MIN=+(C.min||15),LAT=+(C.lat||6),DEMO=C.demo=='1';
const T_ANSWER=10;
const $=id=>document.getElementById(id),W=ms=>new Promise(r=>setTimeout(r,ms));
const status=t=>$('status').textContent=t;
let bank=[],order=[],qi=0,scores={},names={},streak={},answers=[],liveChatId=null,nextTok=null,startAt=0;
const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,v=.12,type='sine'){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const tick=()=>beep(880,.06,.06,'square'),ding=()=>{beep(988,.35,.15);setTimeout(()=>beep(1319,.5,.15),120)};
function play(url){return new Promise(res=>{const a=new Audio(url);a.onended=res;a.onerror=res;a.play().catch(res);setTimeout(res,16000)})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function cover(html){$('cover').innerHTML=html;$('cover').style.display=html?'flex':'none'}

/* ---------- chat YouTube ---------- */
async function api(path){const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+(path.includes('?')?'&':'?')+'key='+KEY);const j=await r.json();if(j.error)throw new Error(j.error.message);return j}
async function findChat(){
  while(!liveChatId){
    try{
      let vid=C.video;
      if(!vid){const s=await api(`search?part=id&channelId=${CHANNEL}&eventType=live&type=video&maxResults=1`);vid=s.items[0]&&s.items[0].id.videoId}
      if(vid){const v=await api(`videos?part=liveStreamingDetails&id=${vid}`);liveChatId=v.items[0]&&v.items[0].liveStreamingDetails&&v.items[0].liveStreamingDetails.activeLiveChatId}
      status(liveChatId?'chat connected':'waiting for live…');
    }catch(e){status('chat: '+e.message)}
    if(!liveChatId)await W(30000);
  }
  pollChat();
}
async function pollChat(){
  for(;;){
    let wait=7000;
    try{
      const j=await api(`liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&maxResults=2000`+(nextTok?`&pageToken=${nextTok}`:''));
      const first=!nextTok;nextTok=j.nextPageToken;wait=Math.max(6000,j.pollingIntervalMillis||0);
      if(!first)for(const m of j.items||[]){const t=(m.snippet.displayMessage||'').trim();answers.push({u:m.authorDetails.channelId,n:m.authorDetails.displayName,t,ts:Date.parse(m.snippet.publishedAt)})}
      status('chat ok · '+Object.keys(scores).length+' players');
    }catch(e){status('chat: '+e.message);wait=15000}
    await W(wait);
  }
}
function parseAns(t,q){
  t=t.trim();const u=t.toUpperCase();
  let m=u.match(/^[\s"'(\[]*([ABCD1-4])(?:[\s).!:,\-]|$)/);
  if(m){const c=m[1];return 'ABCD'.includes(c)?'ABCD'.indexOf(c):(+c-1)}
  const low=t.toLowerCase();const k=q.o.findIndex(o=>o.toLowerCase()==low);return k
}
function demoAnswers(q,t0){
  const bots=['Alex','Maya','Noah','Lina','Sam','Zoe','Omar','Ivy','Leo','Ana'];
  for(const b of bots){if(Math.random()<.75){const right=Math.random()<.6;const c=right?q.a:(q.a+1+(Math.random()*3|0))%4;answers.push({u:'demo_'+b,n:b,t:'ABCD'[c],ts:t0+1000+Math.random()*9000})}}
}
function score(q,t0,t1,tStart){
  const got={},tsOf={},cnt=[0,0,0,0];
  for(const a of answers){if(a.ts<t0||a.ts>t1||got[a.u]!==undefined)continue;const k=parseAns(a.t,q);if(k<0||k>3)continue;got[a.u]=k;tsOf[a.u]=a.ts;names[a.u]=a.n;cnt[k]++}
  answers=answers.filter(a=>a.ts>t1);
  const win=[];
  for(const u in got){if(got[u]==q.a){const dt=(tsOf[u]-tStart)/1000;let pts=dt<=3?3:dt<=6?2:1;streak[u]=(streak[u]||0)+1;if(streak[u]%5==0)pts+=1;scores[u]=(scores[u]||0)+pts;win.push(names[u]+' +'+pts)}else streak[u]=0}
  return {win,cnt,total:Object.keys(got).length}
}
function board(last){
  const top=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('rows').innerHTML=top.length?top.map(([u,s],i)=>`<div class="r"><i>${i+1}</i><span>${esc(names[u])}${streak[u]>=3?' 🔥':''}</span><em>${s}</em></div>`).join(''):'<div class="r"><span style="color:#c9d0ff">Answer in the chat to get on the board!</span></div>';
  $('players').textContent=Object.keys(scores).length?Object.keys(scores).length+' players':'';
  if(last!==undefined)$('last').textContent=last;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- show ---------- */
function pre(q){const i=new Image();i.src=BASE+q.img;new Audio(BASE+'live/'+q.clip.q).preload='auto'}
async function round(q,n){
  $('lvl').textContent=q.lvl;$('lvl').style.background={EASY:'#2BD96B',MEDIUM:'#5A8CFF',HARD:'#FF8A3D',GENIUS:'#FF3D7F'}[q.lvl]||'#5A8CFF';
  $('count').textContent='Question '+n;
  $('q').textContent=q.q;$('fact').style.opacity=0;
  $('photo').className=q.contain?'contain':'';$('img').src=BASE+q.img;
  $('opts').innerHTML=q.o.map((o,i)=>`<div class="o"><b>${'ABCD'[i]}</b>${esc(o)}<span class="pct"></span></div>`).join('');
  $('fill').style.transition='none';$('fill').style.transform='scaleX(1)';$('secs').textContent='';
  const t0=Date.now();
  const img=$('img'),z0=q.contain?1.6:2.4,zd=(q.dq||3)+T_ANSWER;
  img.style.transition='none';img.style.transform=`scale(${z0})`;img.offsetWidth;
  img.style.transition=`transform ${zd}s cubic-bezier(.25,.1,.25,1)`;img.style.transform='scale(1)';
  if(DEMO)demoAnswers(q,t0);
  await play(BASE+'live/'+q.clip.q);
  const tStart=Date.now()+LAT*1000;
  $('fill').offsetWidth;$('fill').style.transition=`transform ${T_ANSWER}s linear`;$('fill').style.transform='scaleX(0)';
  for(let s=T_ANSWER;s>0;s--){$('secs').textContent=s;if(s<=5)tick();await W(1000)}
  $('secs').textContent='0';
  const t1=Date.now()+LAT*1000;
  ding();
  [...$('opts').children].forEach((e,i)=>e.classList.add(i==q.a?'ok':'no'));
  $('fact').textContent=q.f;$('fact').style.opacity=1;
  const ans=play(BASE+'live/'+q.clip.a);
  setTimeout(()=>{img.style.transition='transform .4s';img.style.transform='scale(1)';const r=score(q,t0,t1,DEMO?t0+4000:tStart);
    if(r.total){[...$('opts').children].forEach((e,i)=>e.querySelector('.pct').textContent=Math.round(100*r.cnt[i]/r.total)+'%')}
    board(r.win.length?`✅ Q${n}: ${r.win.length} correct — ${r.win.slice(0,5).join(', ')}${r.win.length>5?'…':''}`:(r.total?`Q${n}: nobody got it!`:''));
  },DEMO?1500:LAT*1000);
  await ans;await W(Math.max(2500,DEMO?1700:LAT*1000-1500));
}
async function main(){
  cover(`<h1>QUIZ <span>RUSH</span> LIVE</h1><p>Loading questions…</p>`);
  bank=await fetch(BASE+'live/bank.json?'+Date.now()).then(r=>r.json());
  const lv={EASY:0,MEDIUM:1,HARD:2,GENIUS:3};
  order=shuffle(bank.slice());
  board();
  if(KEY)findChat();else status(DEMO?'demo mode':'no API key: chat off');
  cover(`<h1>QUIZ <span>RUSH</span> LIVE</h1><p>Type <b style="color:#FFD23F">A, B, C or D</b> in the chat to answer.<br>Fast answers score more: 3 pts in the first 3 s, 2 pts before 6 s, 1 pt after.<br>Answer 5 in a row for a 🔥 bonus point!</p><div class="big" id="cd">Starting in 20</div>`);
  for(let s=20;s>0;s--){const e=$('cd');if(e)e.textContent='Starting in '+s;await W(1000)}
  cover('');
  startAt=Date.now();const end=startAt+MIN*60000;let n=1;
  while(Date.now()<end){
    if(qi>=order.length){order=shuffle(bank.slice());qi=0}
    const q=order[qi++];if(order[qi])pre(order[qi]);
    await round(q,n++);
    if((n-1)%15==0&&Date.now()<end){const top=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
      cover(`<p>LEADERBOARD</p><div id="pod">${top.map(([u,s],i)=>`<div class="pd"><div style="font-size:60px">${['🥇','🥈','🥉'][i]}</div><div class="n">${esc(names[u])}</div><div class="s">${s}</div></div>`).join('')||'<p>Answer in the chat to get on the board!</p>'}</div><p>Keep playing — next question in a few seconds!</p>`);await W(8000);cover('')}
  }
  const top=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);
  cover(`<h1>FINAL <span>RESULTS</span></h1><div id="pod">${top.map(([u,s],i)=>`<div class="pd"><div style="font-size:70px">${['🥇','🥈','🥉'][i]}</div><div class="n">${esc(names[u])}</div><div class="s">${s}</div></div>`).join('')||'<p>Thanks for watching!</p>'}</div><p>Thanks for playing! A new quiz every day on Quiz Rush Show.</p>`);
  window.QR_FINAL={scores,names};
}
main();
</script>
</body>
</html>
